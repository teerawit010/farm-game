<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Prototype</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#87c76e;
    display:flex;
    flex-direction:column;
    align-items:center;
}
h1{
    margin-top:20px;
}
#game{
    display:grid;
    grid-template-columns:repeat(8,60px);
    gap:4px;
    margin:20px;
}
.tile{
    width:60px;
    height:60px;
    background:#8b5a2b;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    font-size:28px;
}
.info{
    background:white;
    padding:12px 20px;
    border-radius:12px;
    margin-bottom:20px;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>
<body>

<h1>🌾 Cozy Farm Prototype</h1>

<div class="info">
    Coins: <span id="coins">50</span> |
    Seeds: <span id="seeds">5</span>
</div>

<button onclick="buySeeds()">Buy Seeds (10 coins)</button>

<div id="game"></div>

<script>
const game = document.getElementById("game");
const coinsEl = document.getElementById("coins");
const seedsEl = document.getElementById("seeds");

let coins = 50;
let seeds = 5;

const tiles = [];

function updateUI(){
    coinsEl.textContent = coins;
    seedsEl.textContent = seeds;
}

function createTile(index){
    const div = document.createElement("div");
    div.className = "tile";
    div.dataset.state = "empty";
    div.innerHTML = "";

    div.onclick = () => handleTile(div);

    game.appendChild(div);
    tiles.push(div);
}

function handleTile(tile){
    const state = tile.dataset.state;

    if(state === "empty"){
        if(seeds <= 0){
            alert("No seeds!");
            return;
        }

        seeds--;
        updateUI();

        tile.dataset.state = "growing";
        tile.innerHTML = "🌱";

        setTimeout(() => {
            tile.dataset.state = "ready";
            tile.innerHTML = "🥕";
        }, 5000);

    } else if(state === "ready"){
        coins += 20;
        updateUI();

        tile.dataset.state = "empty";
        tile.innerHTML = "";
    }
}

function buySeeds(){
    if(coins >= 10){
        coins -= 10;
        seeds += 3;
        updateUI();
    } else {
        alert("Not enough coins!");
    }
}

for(let i=0;i<40;i++){
    createTile(i);
}

updateUI();
</script>

</body>
</html>
